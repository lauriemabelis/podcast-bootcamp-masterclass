<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found</title>
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #000321;
      --bg-alt: #0D1029;
      --ink:    #FFFFFF;
      --ink-2:  #B7C2CC;
      --accent: #FF6C00;
      --border: rgba(255, 108, 0, 0.12);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 24px;
    }

    .code {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Sora', system-ui, sans-serif;
      font-size: clamp(1.9rem, 7vw, 2.8rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 16px;
    }

    .grad-text {
      background: linear-gradient(135deg, #FF6C00 0%, #FF6240 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      font-size: 1rem;
      color: var(--ink-2);
      line-height: 1.65;
      max-width: 440px;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 15px 30px;
      background: linear-gradient(135deg, #FF6C00 0%, #FF6240 100%);
      color: #fff;
      font-family: 'Sora', system-ui, sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 9999px;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.2s;
    }

    .btn:hover { opacity: 0.92; transform: translateY(-1px); }

    footer {
      margin-top: 48px;
      font-size: 0.8rem;
      color: var(--ink-2);
    }

    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>

  <p class="code">Error 404</p>

  <h1>This page has <span class="grad-text">moved on.</span></h1>

  <p>
    The link you followed points at something that is no longer here. The masterclass
    itself is very much still happening.
  </p>

  <a class="btn" href="/">Take me to the masterclass</a>

  <footer>
    &copy; 2026 Dextropreneur · <a href="mailto:laurie@dextropreneur.com">laurie@dextropreneur.com</a>
  </footer>

</body>
</html>
